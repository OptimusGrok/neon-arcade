<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>Galactic Arcade (moved)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="0; url=https://optimusgrok.github.io/galactic-arcade/">
<link rel="canonical" href="https://optimusgrok.github.io/galactic-arcade/">
<script>
(function(){var u='https://optimusgrok.github.io/galactic-arcade/'+location.search+location.hash;
if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister();});}).catch(function(){});
if(window.caches)caches.keys().then(function(k){k.forEach(function(n){caches.delete(n);});}).catch(function(){});
location.replace(u);})();
</script></head>
